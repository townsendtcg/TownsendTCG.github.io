function CardSheet({ card, all, onClose, onSave, onDelete, onMerge, onAddLot, tcgKey, mult }) {
  const [busy, setBusy] = useState(false); const [note, setNote] = useState("");
  const [mode, setMode] = useState("info");
  const [lot, setLot] = useState({ qty: "1", cost: "" }); const [pay, setPay] = useState(true);
  const [mk, setMk] = useState(String(card.market));
  const avg = avgCost(card), v = valueOf({ ...card, market: num(mk) }, mult);
  const want = stickerFor({ ...card, market: num(mk) }, mult);
  const zone = zoneFor({ ...card, market: num(mk) }, mult);

  const curve = useMemo(() => {
    const asc = [...card.lots].sort((a, b) => a.date - b.date);
    let q = 0, cost = 0;
    return asc.map((l) => { q += l.qty; cost += l.qty * l.unitCost; return { ...l, avgAfter: cost / q, runQty: q }; }).reverse();
  }, [card.lots]);
  const twins = all.filter((c) => c.id !== card.id && slug(c.name) === slug(card.name));

  const lookup = async () => {
    setBusy(true); setNote("");
    try {
      const res = await tcgLookup(card.name, card.set, card.number, { tcgId: card.tcgId, printing: card.printing });
      if (res) { setMk(String(res.market)); setNote(`${res.set} · ${res.printing} · ${borderOf(res.series)} border`); onSave(card.id, { series: res.series, border: borderOf(res.series), tcgId: res.tcgId }); }
      else setNote("No match. Enter it manually.");
    } catch { setNote("Lookup failed."); }
    setBusy(false);
  };

  return (
    <Sheet title={card.name} onClose={onClose}>
      <div className="text-xs mb-4" style={{ color: C.muted }}>
        {card.set || "—"}{card.number ? ` #${card.number}` : ""} · {card.printing} · {card.condition} · {card.border} border{card.graded ? " · graded" : ""}
      </div>
      <div className="grid grid-cols-3 gap-2 mb-3">
        <Box label="On hand" value={card.qty} />
        <Box label="Avg cost" value={money(avg)} />
        <Box label="Invested" value={money(card.costPool)} tint={C.purple} />
      </div>
      <div className="rounded-xl p-3.5 mb-4" style={{ background: C.surface2 }}>
        <div className="flex justify-between text-sm mb-2">
          <span style={{ color: C.muted }}>Belongs in</span><span className="font-semibold">{ZONES[zone].label}</span>
        </div>
        <div className="flex justify-between text-sm">
          <span style={{ color: C.muted }}>Sticker should read</span>
          <span className="font-mono font-bold" style={{ color: C.gold }}>
            {carriesSticker({ ...card, market: num(mk) }, mult) ? `$${want}` : "no price"}
          </span>
        </div>
      </div>

      <div className="flex gap-2 mb-4">
        {[["info", "Details"], ["lot", "Add lot"], ["merge", "Pool"]].map(([k, l]) => (
          <button key={k} onClick={() => setMode(k)} className="flex-1 py-2.5 rounded-lg text-xs font-semibold"
            style={{ background: mode === k ? C.surface2 : "transparent", color: mode === k ? C.text : C.muted, border: `1px solid ${C.line}` }}>{l}</button>
        ))}
      </div>

      {mode === "info" && <>
        <Field label="Market value (NM base)" value={mk} onChange={(e) => setMk(e.target.value)} inputMode="decimal" />
        <div className="text-xs mb-3 px-1" style={{ color: C.muted }}>
          {card.condition} sells at {Math.round((COND_MULT[card.condition] ?? 1) * 100)}% of NM, so this copy is worth {money(v)}.
        </div>
        <button onClick={lookup} disabled={busy} className="w-full rounded-lg py-3 mb-1 text-sm font-semibold flex items-center justify-center gap-2" style={{ background: C.surface2, color: C.gold }}>
          {busy ? <Loader2 size={16} className="animate-spin" /> : <TrendingUp size={16} />}{busy ? "Checking market" : "Look up market value"}
        </button>
        {note && <div className="text-xs mb-3 text-center" style={{ color: C.muted }}>{note}</div>}
        <Chips label="Condition" options={CONDITIONS} value={card.condition} onChange={(k) => onSave(card.id, { condition: k })} tint={C.purple} />

        <Section title={`Acquisitions (${card.lots.length})`} />
        <div className="space-y-1.5 mb-4">
          {curve.map((l) => (
            <div key={l.id} className="flex items-center gap-3 rounded-lg px-3 py-2.5" style={{ background: C.surface2 }}>
              <div className="flex-1 min-w-0">
                <div className="text-sm">{l.qty}x at {money(l.unitCost)}</div>
                <div className="text-xs" style={{ color: C.muted }}>{new Date(l.date).toLocaleDateString()} · {l.source}</div>
              </div>
              <div className="text-right shrink-0">
                <div className="font-mono text-xs" style={{ color: C.teal }}>avg {money(l.avgAfter)}</div>
                <div className="text-xs" style={{ color: C.muted }}>after {l.runQty}</div>
              </div>
            </div>
          ))}
        </div>
        <div className="mb-3">
          <BigBtn onClick={() => { onSave(card.id, { market: num(mk), priced: true, pricedAt: Date.now(), sticker: want, zone }); onClose(); }}>
            <Check size={18} /> Save and mark tagged
          </BigBtn>
        </div>
        <button onClick={() => onDelete(card.id)} className="w-full py-3 text-sm flex items-center justify-center gap-2" style={{ color: C.loss }}>
          <Trash2 size={15} /> Remove from book</button>
      </>}

      {mode === "lot" && <>
        <div className="text-xs mb-3" style={{ color: C.muted }}>Bought more copies. This pools into the average.</div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Quantity" value={lot.qty} onChange={(e) => setLot({ ...lot, qty: e.target.value })} inputMode="numeric" />
          <Field label="Cost each" value={lot.cost} onChange={(e) => setLot({ ...lot, cost: e.target.value })} inputMode="decimal" placeholder="0.00" />
        </div>
        <div className="rounded-xl p-3.5 mb-4 flex justify-between text-sm" style={{ background: C.surface2 }}>
          <span style={{ color: C.muted }}>New average would be</span>
          <span className="font-mono font-semibold" style={{ color: C.teal }}>
            {money((card.costPool + num(lot.cost) * (num(lot.qty) || 1)) / (card.qty + (num(lot.qty) || 1)))}
          </span>
        </div>
        <button onClick={() => setPay(!pay)} className="w-full flex items-center gap-3 rounded-lg p-3 mb-4" style={{ background: C.surface2 }}>
          <div className="w-6 h-6 rounded flex items-center justify-center shrink-0" style={{ background: pay ? C.teal : "transparent", border: `1px solid ${pay ? C.teal : C.line}` }}>
            {pay && <Check size={15} color={C.ink} />}</div>
          <span className="text-sm text-left">Paid with business cash</span>
        </button>
        <BigBtn onClick={() => onAddLot(card.id, num(lot.qty) || 1, num(lot.cost), pay)} disabled={num(lot.cost) <= 0} bg={C.purple} fg="#fff"><Plus size={18} /> Add lot</BigBtn>
      </>}

      {mode === "merge" && <>
        <div className="text-xs mb-3" style={{ color: C.muted }}>Pool this into another copy of the same card. Use when a photo split one card into two records.</div>
        {twins.length === 0 ? <Empty text="No other records with this name." /> : (
          <div className="space-y-2">
            {twins.map((t) => (
              <button key={t.id} onClick={() => onMerge(card.id, t.id)} className="w-full text-left rounded-xl p-3 flex items-center gap-3" style={{ background: C.surface2 }}>
                <Merge size={16} color={C.muted} className="shrink-0" />
                <div className="flex-1 min-w-0">
                  <div className="text-sm truncate">{t.set || "—"} · {t.printing} · {t.condition}</div>
                  <div className="text-xs" style={{ color: C.muted }}>{t.qty} on hand · avg {money(avgCost(t))}</div>
                </div>
              </button>
            ))}
          </div>
        )}
      </>}
    </Sheet>
  );
}

function Box({ label, value, tint = C.text }) {
  return (
    <div className="rounded-xl p-3" style={{ background: C.surface2 }}>
      <div className="text-xs mb-1" style={{ color: C.muted }}>{label}</div>
      <div className="font-mono font-bold text-base" style={{ color: tint }}>{value}</div>
    </div>
  );
}

function LedgerSheet({ onClose, onConfirm }) {
  const [amt, setAmt] = useState(""); const [type, setType] = useState("expense"); const [note, setNote] = useState(""); const [method, setMethod] = useState("Cash");
  const out = type === "expense";
  return (
    <Sheet title="Cash entry" onClose={onClose}>
      <div className="flex gap-2 mb-4">
        {[["expense", "Money out"], ["deposit", "Money in"]].map(([k, label]) => (
          <button key={k} onClick={() => setType(k)} className="flex-1 py-3 rounded-lg text-sm font-semibold"
            style={{ background: type === k ? (k === "expense" ? C.loss : C.teal) : C.surface2, color: type === k ? (k === "expense" ? "#fff" : C.ink) : C.muted }}>{label}</button>
        ))}
      </div>
      <Field label="Amount" value={amt} onChange={(e) => setAmt(e.target.value)} inputMode="decimal" placeholder="0.00" />
      <Field label="What for" value={note} onChange={(e) => setNote(e.target.value)} placeholder={out ? "Booth fee, gas, food" : "Owner deposit"} />
      <Chips label="Account" options={METHODS} value={method} onChange={setMethod} />
      <BigBtn onClick={() => onConfirm(out ? -num(amt) : num(amt), type, note || (out ? "Expense" : "Deposit"), method)} disabled={num(amt) <= 0} bg={out ? C.loss : C.teal} fg={out ? "#fff" : C.ink}>
        <Check size={18} /> Record {money(num(amt))}
      </BigBtn>
    </Sheet>
  );
}

/* ============================ SCANNER ============================ */
const inputCls = "rounded-lg py-2.5 px-3 text-sm outline-none";
const inputSty = { background: C.surface2, border: `1px solid ${C.line}`, color: C.text };

function ScanSheet({ mode: startMode, db, mult, onClose, onConfirm }) {
  const [mode, setMode] = useState(startMode || "add");
  const [rows, setRows] = useState([]);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [lotTotal, setLotTotal] = useState("");
  const [pay, setPay] = useState(true);
  const camRef = useRef(null), libRef = useRef(null);

  const setRow = (id, p) => setRows((rs) => rs.map((r) => (r.id === id ? { ...r, ...p } : r)));
  const dropRow = (id) => setRows((rs) => rs.filter((r) => r.id !== id));

  const price = async (row) => {
    if (row.kind === "sealed") { setRow(row.id, { state: "miss" }); return; }
    setRow(row.id, { state: "loading" });
    try {
      const res = await tcgLookup(row.name, row.set, row.number, { printing: row.printing });
      if (res) setRow(row.id, {
        state: "done", market: res.market, set: res.set || row.set, number: res.number || row.number,
        printing: row.userPrinting ? row.printing : (res.printing || row.printing),
        tcgId: res.tcgId, series: res.series, image: res.image,
      });
      else setRow(row.id, { state: "miss", market: null, image: null, tcgId: null });
    } catch { setRow(row.id, { state: "miss" }); }
  };

  const handleFile = async (e) => {
    const file = e.target.files?.[0]; e.target.value = ""; if (!file) return;
    setErr(""); setBusy(true);
    try {
      const big = await resize(file, 1600, 0.85);
      const data = await scanPhoto(big, "add");
      const found = (data.cards || []).map((c) => ({
        id: uid(), name: c.name || "", set: c.set || "", number: c.number || "",
        printing: PRINTINGS.includes(c.printing) ? c.printing : "Normal", userPrinting: false, condition: "NM",
        graded: !!c.graded, grade: c.grade || "", kind: c.kind === "sealed" ? "sealed" : "single",
        language: c.language || "English", confidence: c.confidence || "medium",
        qty: "1", cost: "", market: null, state: "idle", image: null, tcgId: null, series: "",
      }));
      if (!found.length) setErr("No cards found in that photo. Try closer, flatter, and with less glare.");
      setRows((rs) => [...rs, ...found]);
      setBusy(false);
      for (const r of found) await price(r);
    } catch (ex) { setErr(scanErr(ex)); setBusy(false); }
  };

  const card = (r) => ({ market: r.market || 0, condition: r.condition, graded: r.graded, border: borderOf(r.series) });
  const valueRow = (r) => (r.market ? valueOf(card(r), mult) : 0);
  const units = sum(rows, (r) => Math.max(1, Math.round(num(r.qty) || 1)));
  const lotBase = sum(rows, (r) => valueRow(r) * Math.max(1, Math.round(num(r.qty) || 1)));
  const lot = num(lotTotal) > 0;
  const unitCostOf = (r) => lot ? (lotBase > 0 ? (num(lotTotal) * valueRow(r)) / lotBase : num(lotTotal) / Math.max(1, units)) : num(r.cost);
  const costTotal = sum(rows, (r) => Math.round(unitCostOf(r) * 100) / 100 * Math.max(1, Math.round(num(r.qty) || 1)));
  const have = (r) => sum(db.cards.filter((c) => c.qty > 0 && ((r.tcgId && c.tcgId === r.tcgId) ||
    (slug(c.name) === slug(r.name) && r.number && normNum(c.number) === normNum(r.number)))), (c) => c.qty);
  const pricing = rows.some((r) => r.state === "loading" || r.state === "idle");

  const confirm = () => onConfirm(rows.filter((r) => r.name.trim()).map((r) => ({
    qty: Math.max(1, Math.round(num(r.qty) || 1)),
    unitCost: Math.round(unitCostOf(r) * 100) / 100,
    data: { name: r.name.trim(), set: r.set, number: r.number, printing: r.printing, condition: r.condition, kind: r.kind,
      graded: r.graded, market: r.market || 0, tcgId: r.tcgId, series: r.series },
  })), pay);

  return (
    <Sheet title={mode === "add" ? "Scan to add" : "Price check"} onClose={onClose}>
      <input ref={camRef} type="file" accept="image/*" capture="environment" onChange={handleFile} className="hidden" />
      <input ref={libRef} type="file" accept="image/*" onChange={handleFile} className="hidden" />
      <div className="flex gap-2 mb-3">
        {[["add", "Add to stock"], ["check", "Price check"]].map(([k, l]) => (
          <button key={k} onClick={() => setMode(k)} className="flex-1 py-2.5 rounded-lg text-xs font-semibold"
            style={{ background: mode === k ? C.surface2 : "transparent", color: mode === k ? C.text : C.muted, border: `1px solid ${C.line}` }}>{l}</button>
        ))}
      </div>
      <div className="grid grid-cols-2 gap-2 mb-3">
        <button onClick={() => camRef.current?.click()} disabled={busy} className="rounded-xl py-4 flex items-center justify-center gap-2 font-semibold"
          style={{ background: C.purple, color: "#fff", opacity: busy ? 0.5 : 1 }}><Camera size={18} /> {rows.length ? "Scan more" : "Take photo"}</button>
        <button onClick={() => libRef.current?.click()} disabled={busy} className="rounded-xl py-4 flex items-center justify-center gap-2 font-semibold"
          style={{ background: C.surface2, color: C.text, border: `1px solid ${C.line}`, opacity: busy ? 0.5 : 1 }}><ImageIcon size={18} /> From photos</button>
      </div>
      {!rows.length && !busy && <div className="text-xs mb-3 px-1 leading-relaxed" style={{ color: C.muted }}>
        One card or a whole binder page per photo. Lay cards flat, fill the frame, and tilt away from lights to cut glare.
        Every card gets a market price you can check and fix before anything is saved.
      </div>}
      {busy && <div className="rounded-xl py-6 mb-3 flex flex-col items-center gap-2" style={{ background: C.surface2 }}>
        <Loader2 className="animate-spin" size={22} color={C.teal} /><div className="text-sm" style={{ color: C.muted }}>Reading cards</div></div>}
      {err && <div className="rounded-xl p-3 mb-3 text-sm flex gap-2" style={{ background: "rgba(244,114,106,0.12)", color: C.loss }}>
        <AlertTriangle size={16} className="shrink-0 mt-0.5" />{err}</div>}

      <div className="space-y-2 mb-3">
        {rows.map((r) => <ScanRow key={r.id} r={r} mode={mode} mult={mult} have={have(r)} unitCost={unitCostOf(r)} lot={lot}
          onSet={(p) => setRow(r.id, p)} onDrop={() => dropRow(r.id)} onReprice={(p) => price({ ...r, ...p })} />)}
      </div>

      {rows.length > 0 && <div className="rounded-xl p-3.5 mb-3" style={{ background: C.surface2 }}>
        <div className="flex justify-between text-sm"><span style={{ color: C.muted }}>{units} card{units === 1 ? "" : "s"} at market</span>
          <span className="font-mono font-semibold" style={{ color: C.purple }}>{money(lotBase)}</span></div>
        {mode === "add" && <div className="flex justify-between text-sm mt-1.5"><span style={{ color: C.muted }}>Your cost</span>
          <span className="font-mono font-semibold">{money(costTotal)}</span></div>}
      </div>}

      {mode === "add" && rows.length > 0 && <>
        <Field label="Paid one price for the whole lot? Enter it here and it's split by market value" value={lotTotal}
          onChange={(e) => setLotTotal(e.target.value)} inputMode="decimal" placeholder="0.00" />
        <button onClick={() => setPay(!pay)} className="w-full flex items-center gap-3 rounded-lg p-3 mb-4" style={{ background: C.surface2 }}>
          <div className="w-6 h-6 rounded flex items-center justify-center shrink-0" style={{ background: pay ? C.teal : "transparent", border: `1px solid ${pay ? C.teal : C.line}` }}>
            {pay && <Check size={15} color={C.ink} />}</div>
          <span className="text-sm text-left">Paid with business cash ({money(costTotal)} out)</span>
        </button>
        <BigBtn onClick={confirm} disabled={pricing || !rows.some((r) => r.name.trim())} bg={C.purple} fg="#fff">
          {pricing ? <><Loader2 size={18} className="animate-spin" /> Checking prices</> : <><Plus size={18} /> Add {units} to stock</>}
        </BigBtn>
      </>}
      {mode === "check" && rows.length > 0 && <button onClick={() => { setRows([]); setErr(""); }} className="w-full py-3 text-sm" style={{ color: C.muted }}>Clear and check another</button>}
    </Sheet>
  );
}

function ScanRow({ r, mode, mult, have, unitCost, lot, onSet, onDrop, onReprice }) {
  const [edit, setEdit] = useState(false);
  const card = { market: r.market || 0, condition: r.condition, graded: r.graded, border: borderOf(r.series) };
  const v = r.market ? valueOf(card, mult) : 0;
  const tag = r.market && carriesSticker(card, mult) ? stickerFor(card, mult) : null;
  const zone = r.market ? zoneFor(card, mult) : null;
  const warn = r.state === "miss" || r.confidence === "low";
  const notes = [
    r.confidence === "low" && "Hard to read, double check it",
    r.graded && "Price shown is for a raw copy",
    r.language && r.language !== "English" && "Price shown is for the English card",
    r.kind === "sealed" && "Sealed product: enter the price by hand",
  ].filter(Boolean);
  return (
    <div className="rounded-xl p-3" style={{ background: C.surface, border: `1px solid ${warn ? "rgba(240,184,73,0.45)" : C.line}` }}>
      <div className="flex gap-3 mb-2">
        {r.image ? <img src={r.image} alt="" className="w-14 rounded-md shrink-0 self-start" style={{ aspectRatio: "63/88", objectFit: "cover" }} />
          : <div className="w-14 rounded-md shrink-0 flex items-center justify-center self-start" style={{ aspectRatio: "63/88", background: C.surface2 }}>
              {r.state === "loading" ? <Loader2 size={16} className="animate-spin" color={C.muted} /> : <ImageIcon size={16} color={C.muted} />}</div>}
        <div className="flex-1 min-w-0">
          <div className="flex items-start gap-2">
            <div className="flex-1 min-w-0">
              <div className="text-sm font-semibold truncate">{r.name || "Unknown card"}</div>
              <div className="text-xs truncate" style={{ color: C.muted }}>
                {r.set || "set unknown"}{r.number ? ` · #${r.number}` : ""}{r.graded ? ` · ${r.grade || "graded"}` : ""}
              </div>
            </div>
            <button onClick={onDrop} className="p-1.5 rounded-lg shrink-0" style={{ background: C.surface2 }}><X size={14} color={C.muted} /></button>
          </div>
          <div className="flex items-baseline gap-2 mt-1.5">
            {r.state === "loading" || r.state === "idle" ? <span className="text-xs" style={{ color: C.muted }}>Checking price…</span>
              : r.market ? <>
                  <span className="font-mono text-sm font-semibold" style={{ color: C.purple }}>{money(v)}</span>
                  <span className="text-xs" style={{ color: C.muted }}>{ZONES[zone].short}</span>
                  <span className="font-mono text-xs ml-auto" style={{ color: C.gold }}>{tag != null ? `tag $${tag}` : "no tag"}</span>
                </>
              : <span className="text-xs" style={{ color: C.gold }}>No price match. Check the name and number.</span>}
          </div>
          {mode === "check" && have > 0 && <div className="text-xs mt-1" style={{ color: C.teal }}>{have} already in stock</div>}
          {notes.length > 0 && <div className="text-xs mt-1" style={{ color: C.gold }}>{notes.join(" · ")}</div>}
        </div>
      </div>
      <Chips options={PRINTINGS} value={r.printing} onChange={(k) => { onSet({ printing: k, userPrinting: true }); onReprice({ printing: k, userPrinting: true }); }} tint={C.purple} />
      {mode === "add" && <>
        <Chips options={CONDITIONS} value={r.condition} onChange={(k) => onSet({ condition: k })} tint={C.purple} />
        <div className="flex gap-2 items-center">
          <input value={r.qty} onChange={(e) => onSet({ qty: e.target.value })} inputMode="numeric" className={`w-14 text-center font-mono ${inputCls}`} style={inputSty} />
          {lot ? <div className="flex-1 text-xs font-mono" style={{ color: C.muted }}>cost {money(unitCost)} each (from lot)</div>
            : <input value={r.cost} onChange={(e) => onSet({ cost: e.target.value })} inputMode="decimal" placeholder="cost each" className={`flex-1 font-mono ${inputCls}`} style={inputSty} />}
          {r.kind === "sealed" && <input value={r.market || ""} onChange={(e) => onSet({ market: num(e.target.value) || null, state: "done" })} inputMode="decimal" placeholder="market" className={`w-24 font-mono ${inputCls}`} style={inputSty} />}
        </div>
      </>}
      <button onClick={() => setEdit(!edit)} className="text-xs mt-2" style={{ color: C.muted }}>{edit ? "Close" : "Wrong card? Edit it"}</button>
      {edit && <div className="mt-2 space-y-2">
        <input value={r.name} onChange={(e) => onSet({ name: e.target.value })} placeholder="Card name" className={`w-full ${inputCls}`} style={inputSty} />
        <div className="flex gap-2">
          <input value={r.set} onChange={(e) => onSet({ set: e.target.value })} placeholder="Set" className={`flex-1 ${inputCls}`} style={inputSty} />
          <input value={r.number} onChange={(e) => onSet({ number: e.target.value })} placeholder="Number" className={`w-28 font-mono ${inputCls}`} style={inputSty} />
        </div>
        <button onClick={() => { onReprice({}); setEdit(false); }} className="w-full rounded-lg py-2.5 text-xs font-semibold" style={{ background: C.surface2, color: C.gold }}>Look it up again</button>
      </div>}
    </div>
  );
}

createRoot(document.getElementById("root")).render(<PinGate><BoothBook /></PinGate>);
</script>
