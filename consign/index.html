<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Consignment | Townsend TCG</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07080f">
<link rel="canonical" href="https://townsendtcg.com/">
<style>
:root{--bg:#07080f;--surface:#13162a;--line-2:rgba(255,255,255,.14);--ink:#f4f5fa;--ink-2:#b6bacd;--teal:#6fd8ca;--paper:#f5f5f7;--grad:linear-gradient(100deg,#8b7ae3 0%,#6f9fdb 50%,#72d8cb 100%);--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif}
*,*::before,*::after{box-sizing:border-box}*{margin:0}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.5 var(--font);padding:0 16px 40px}
.wrap{max-width:640px;margin:0 auto}
a{color:var(--teal)}
.top{padding:18px 0}
.logo{font-weight:800;letter-spacing:.04em;text-decoration:none;color:var(--ink)}.logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:clamp(28px,7vw,38px);line-height:1.1;letter-spacing:-.02em;margin:24px 0 12px}
p{color:var(--ink-2);font-size:17px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 22px;border-radius:999px;font-size:17px;font-weight:600;text-decoration:none;width:100%;margin-top:10px}
.btn-primary{color:#3e63c9;border:2px solid transparent;background:linear-gradient(var(--paper),var(--paper)) padding-box,var(--grad) border-box}
.btn-glass{color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line-2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="logo" href="/">TOWNSEND <b>TCG</b></a></div>
  <h1>Consignment isn't open online right now</h1>
  <p>If you have cards you'd like to sell, send me a message or bring them by a show and we'll work it out in person.</p>
  <a class="btn btn-primary" href="https://ig.me/m/townsend_tcg" target="_blank" rel="noopener">Message me on Instagram</a>
  <a class="btn btn-glass" href="/#shows">See the show schedule</a>
</div>
</body>
</html>
